<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emote Overlay</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: transparent; /* Transparent background for OBS overlay */
    }
    
    .emote-img {
      position: absolute;
      /* Smooth fade-in and fade-out animation using CSS */
      animation: fadeEffect var(--duration, 5s) ease-in-out forwards;
      pointer-events: none;
    }

    @keyframes fadeEffect {
      0% { opacity: 0; transform: scale(0.5); }
      10% { opacity: 1; transform: scale(1.1); }
      15% { transform: scale(1); }
      85% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.8); }
    }
    
    /* Betting UI styles */
    #bet-container {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 315px;
      border-radius: 12px;
      color: white;
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 16px;
      box-sizing: border-box;
      opacity: 0;
      transform: translateY(-20px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      pointer-events: none;
      z-index: 1000;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }

    #chatwar-container {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 315px;
      border-radius: 12px;
      color: white;
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 16px;
      box-sizing: border-box;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      pointer-events: none;
      z-index: 1000;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }

    #bet-container.visible, #chatwar-container.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .bet-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .timer-bar-bg {
      width: 100%;
      height: 6px;
      background-color: rgba(255,255,255,0.2);
      border-radius: 3px;
      margin-bottom: 8px;
      overflow: hidden;
    }

    .timer-bar-fill {
      height: 100%;
      width: 100%;
      background-color: #4caf50;
    }

    .bet-bar-bg {
      width: 100%;
      height: 12px;
      background-color: #e91e63; /* Pink background for Choice B */
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .bet-bar-fill {
      height: 100%;
      background-color: #2196f3; /* Blue background for Choice A */
      width: 50%;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .bet-choices {
      display: flex;
      justify-content: space-between;
    }

    .bet-choice {
      width: 48%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .bet-choice.right {
      align-items: flex-end;
      text-align: right;
    }

    .bet-choice-name {
      font-size: 18px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .choice-a .bet-choice-name { color: #2196f3; }
    .choice-b .bet-choice-name { color: #e91e63; }

    .bet-percentage {
      font-size: 42px;
      font-weight: 800;
      margin: 4px 0 12px 0;
    }

    .choice-a .bet-percentage { color: #2196f3; }
    .choice-b .bet-percentage { color: #e91e63; }

    .bet-stat-row {
      display: flex;
      align-items: center;
      font-size: 14px;
      color: #ccc;
      margin-bottom: 4px;
    }

    .bet-choice.right .bet-stat-row {
      flex-direction: row-reverse;
    }

    .bet-stat-icon {
      margin-right: 6px;
      font-size: 14px;
    }
    .bet-choice.right .bet-stat-icon {
      margin-right: 0;
      margin-left: 6px;
    }

    /* Chat War specific styles */
    .chatwar-img {
      width: 48px;
      height: 48px;
      margin-bottom: 4px;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      object-fit: contain;
    }
    /* Scrolling Animation */
    @keyframes scrollUp {
      0% { transform: translateY(100%); }
      100% { transform: translateY(-100%); }
    }
    .scroll-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      z-index: 10;
    }
    .scroll-content {
      animation: scrollUp 6s linear infinite;
      display: flex;
      flex-direction: column;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      width: 100%;
      gap: 4px;
    }
    .scroll-item-winner {
      color: #4ade80; /* bright green */
      text-shadow: 1px 1px 2px #000;
    }
    .scroll-item-loser {
      color: #f87171; /* bright red */
      text-shadow: 1px 1px 2px #000;
    }
    .scroll-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 0 8px;
      box-sizing: border-box;
    }
    .scroll-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: left;
    }
    .scroll-pts {
      white-space: nowrap;
      margin-left: 6px;
      flex-shrink: 0;
    }
  </style>
  <!-- Import canvas-confetti for win animations -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <div id="bet-container">
    <div class="bet-title" id="bet-title"></div>
    <div class="timer-bar-bg">
      <div class="timer-bar-fill" id="timer-bar-fill"></div>
    </div>
    <div class="bet-bar-bg">
      <div class="bet-bar-fill" id="bet-bar"></div>
    </div>
    
    <div class="bet-choices">
      <div class="bet-choice choice-a" id="choice-a-container">
        <div class="bet-choice-name" id="choice-a-name"></div>
        <div class="bet-percentage" id="choice-a-pct"></div>
        <div class="bet-stat-row">
          <span class="bet-stat-icon">💰</span><span id="choice-a-points"></span>
        </div>
      </div>
      
      <div class="bet-choice choice-b right" id="choice-b-container">
        <div class="bet-choice-name" id="choice-b-name"></div>
        <div class="bet-percentage" id="choice-b-pct"></div>
        <div class="bet-stat-row">
          <span class="bet-stat-icon">💰</span><span id="choice-b-points"></span>
        </div>
      </div>
    </div>
  </div>

  <div id="chatwar-container">
    <div class="bet-title" style="text-align: center; text-transform: uppercase;">⚔️ CHAT WAR ⚔️</div>
    <div class="timer-bar-bg" style="background-color: rgba(0,0,0,0.5);">
      <div class="timer-bar-fill" id="chatwar-timer" style="background-color: #ff9800;"></div>
    </div>
    <div class="bet-bar-bg" style="margin-bottom: 12px; background-color: #e91e63;">
      <div class="bet-bar-fill" id="chatwar-bar" style="background-color: #2196f3;"></div>
    </div>
    <div class="bet-choices">
      <div class="bet-choice choice-a" style="align-items: center;">
        <img id="chatwar-img1" class="chatwar-img" src="" style="display: none;">
        <div id="chatwar-name1" style="font-weight: bold; font-size: 14px; margin-bottom: 4px; display: none;"></div>
        <div class="bet-percentage" id="chatwar-score1" style="font-size: 28px; margin: 0;">0</div>
      </div>
      <div class="bet-choice choice-b right" style="align-items: center;">
        <img id="chatwar-img2" class="chatwar-img" src="" style="display: none;">
        <div id="chatwar-name2" style="font-weight: bold; font-size: 14px; margin-bottom: 4px; color: #e91e63; display: none;"></div>
        <div class="bet-percentage" id="chatwar-score2" style="font-size: 28px; margin: 0; color: #e91e63;">0</div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
